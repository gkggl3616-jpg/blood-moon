name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      delivery_only:
        description: Attach existing verified model and latest report without rebuilding APK
        type: boolean
        default: false
      validation_scope:
        description: Character assets only, or full game regression
        type: choice
        options: [character, full]
        default: character

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !inputs.delivery_only }}
    name: Verify UI and build signed prototype APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROGUE_BROWSER_CHANNEL: chrome
      ROGUE_EXPECTED_CERT_SHA256: af43be4b6ee4d5b2e1feca6da3df36805a7b10bbb56b1f884136054ef7f98633
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache verified Android tools
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: android-platform35-buildtools35-v1
      - name: Install UI test browser
        run: |
          python -m pip install playwright==1.58.0
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            python -m playwright install --with-deps chrome
          fi
      - name: Cache prototype signing key
        uses: actions/cache@v4
        with:
          path: tools/signing-cache
          key: rogue-prototype-signing-v1
      - name: Verify offline mobile interface
        if: github.event_name == 'push' || inputs.validation_scope == 'full'
        run: python tools/verify_ui.py
      - name: Verify playable flat test arena
        if: github.event_name == 'push' || inputs.validation_scope == 'full'
        run: python tools/verify_arena.py
      - name: Verify reference run and shared roar in actual gameplay
        if: github.event_name == 'push' || inputs.validation_scope == 'full'
        run: python tools/verify_reference_arena.py
      - name: Verify original Bilge native assets and effects
        run: python tools/verify_bilge_native.py
      - name: Verify short native skin poses and blended contact
        run: |
          python tools/verify_premium_motion.py
          python tools/verify_native_transitions.py
      - name: Verify Karahan character and touch actions
        run: python tools/verify_refresh_touch_audio.py --character karahan
      - name: Download verified Android build tools
        run: python tools/bootstrap_android.py
      - name: Compile and sign APK
        run: python tools/build_apk.py
      - name: Upload installable Android prototype
        uses: actions/upload-artifact@v4
        with:
          name: Rogue-Blood-Moon-v0.1.18-APK
          path: dist/Rogue-Blood-Moon-v0.1.18.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish one directly installable APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_tag="prototype-v0.1.18-${GITHUB_RUN_NUMBER}"
          if gh release view "$apk_tag" >/dev/null 2>&1; then
            gh release upload "$apk_tag" dist/Rogue-Blood-Moon-v0.1.18.apk docs/karahan-v0118/GUNCEL-RAPOR-TR.md --clobber
          else
            gh release create "$apk_tag" dist/Rogue-Blood-Moon-v0.1.18.apk docs/karahan-v0118/GUNCEL-RAPOR-TR.md --target "$GITHUB_SHA" --prerelease --title "Rogue: Blood Moon v0.1.18" --notes-file docs/release-v0118.md
          fi
      - name: Upload UI preview on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: dist/
          if-no-files-found: ignore

  attach:
    if: ${{ inputs.delivery_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify released model bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          expected=json.loads(Path('docs/karahan-v0118/runtime-asset-hashes.json').read_text())['karahan']['sha256']
          p=Path('app/src/main/assets/models/karahan.glb')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==expected
          Path('/tmp/Karahan-Wolf.glb').write_bytes(p.read_bytes())
          PY
      - name: Attach model, preview and latest report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload prototype-v0.1.18-25 /tmp/Karahan-Wolf.glb --clobber
          gh release upload prototype-v0.1.18-25 docs/karahan-v0118/WolfIdle-front.png --clobber
          gh release upload prototype-v0.1.18-25 docs/karahan-v0118/GUNCEL-RAPOR-TR.md --clobber
          gh release view prototype-v0.1.18-25 --json assets --jq '.assets[].name'
