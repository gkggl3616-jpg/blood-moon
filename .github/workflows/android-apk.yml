name: Android APK

on:
  push:
    branches: [main, 'animation-transfer-*', 'character-repair-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify UI and build signed prototype APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ROGUE_BROWSER_CHANNEL: chrome
      ROGUE_EXPECTED_CERT_SHA256: af43be4b6ee4d5b2e1feca6da3df36805a7b10bbb56b1f884136054ef7f98633
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache verified Android tools
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: android-platform35-buildtools35-v1
      - name: Install UI test browser
        run: |
          python -m pip install playwright==1.58.0
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            python -m playwright install --with-deps chrome
          fi
      - name: Cache prototype signing key
        uses: actions/cache@v4
        with:
          path: tools/signing-cache
          key: rogue-prototype-signing-v1
      - name: Verify character models have no stretched triangles
        run: |
          python -m pip install numpy scipy pillow
          python tools/animation_transfer/apply.py
          python tools/animation_transfer/verify.py
          python tools/repair_character_assets.py
          python tools/sanitize_gltf.py
          npm ci --prefix tools/viewer
          node tools/validate_gltf.js
          set -o pipefail
          python tools/verify_models.py 2>&1 | tee /tmp/models.log || { grep FAIL /tmp/models.log | while IFS= read -r l; do echo "::error title=verify_models::$l"; done; exit 1; }
          python tools/audit_characters.py
      - name: Verify offline mobile interface
        run: |
          set -o pipefail
          python tools/verify_ui.py 2>&1 | tee /tmp/verify_ui.log || { tail -n 25 /tmp/verify_ui.log | cut -c1-400 | while IFS= read -r l; do echo "::error title=verify_ui::$l"; done; exit 1; }
      - name: Verify playable flat test arena
        run: |
          set -o pipefail
          python tools/verify_arena.py 2>&1 | tee /tmp/verify_arena.log || { tail -n 25 /tmp/verify_arena.log | cut -c1-400 | while IFS= read -r l; do echo "::error title=verify_arena::$l"; done; exit 1; }
      - name: Verify reload audio and deterministic secondary motion
        run: python tools/verify_v0117_runtime.py
      - name: Verify reference run and shared roar in actual gameplay
        run: |
          set -o pipefail
          python tools/verify_reference_arena.py 2>&1 | tee /tmp/verify_reference_arena.log || { tail -n 25 /tmp/verify_reference_arena.log | cut -c1-400 | while IFS= read -r l; do echo "::error title=verify_reference_arena::$l"; done; exit 1; }
      - name: Verify first-person arms reach their grips for every character
        run: |
          set -o pipefail
          python tools/verify_fp.py 2>&1 | tee /tmp/verify_fp.log || { tail -n 25 /tmp/verify_fp.log | cut -c1-400 | while IFS= read -r l; do echo "::error title=verify_fp::$l"; done; exit 1; }
      - name: Collect v0.1.17 test evidence
        run: python tools/collect_v0117_results.py
      - name: Download verified Android build tools
        run: python tools/bootstrap_android.py
      - name: Compile and sign APK
        run: python tools/build_apk.py
      - name: Upload installable Android prototype
        uses: actions/upload-artifact@v4
        with:
          name: Rogue-Blood-Moon-v0.1.17-APK
          path: dist/Rogue-Blood-Moon-v0.1.17.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish one directly installable APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_tag="prototype-v0.1.17-${GITHUB_RUN_NUMBER}"
          release_files=(
            dist/Rogue-Blood-Moon-v0.1.17.apk
            dist/character-rig-topology-audit.json
            dist/dtx-checksums.json
            dist/v0117-runtime-verification.json
            dist/human-kral-cape-repair.json
            dist/gltf-validator-report.json
            dist/test-results-v0117.json
            docs/verification-v017/compare-wolf-idle.png
            docs/verification-v017/compare-wolf-run.png
            docs/verification-v017/compare-wolf-roll.png
            docs/verification-v017/compare-human-idle.png
          )
          if gh release view "$apk_tag" >/dev/null 2>&1; then
            gh release upload "$apk_tag" "${release_files[@]}" --clobber
          else
            gh release create "$apk_tag" "${release_files[@]}" --target "$GITHUB_SHA" --prerelease --title "Rogue: Blood Moon v0.1.17" --notes-file docs/release-v0117.md
          fi
      - name: Upload UI preview on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: dist/
          if-no-files-found: ignore
