name: Android APK

on:
  push:
    branches: [main, 'animation-transfer-*', 'character-repair-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify UI and build signed prototype APK
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ROGUE_BROWSER_CHANNEL: chrome
      ROGUE_EXPECTED_CERT_SHA256: af43be4b6ee4d5b2e1feca6da3df36805a7b10bbb56b1f884136054ef7f98633
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache verified Android tools
        uses: actions/cache@v4
        with:
          path: tools/cache
          key: android-platform35-buildtools35-v1
      - name: Cache prototype signing key
        uses: actions/cache@v4
        with:
          path: tools/signing-cache
          key: rogue-prototype-signing-v1
      - name: Verify character models have no stretched triangles
        run: |
          python -m pip install numpy scipy pillow
          python tools/animation_transfer/apply.py
          python tools/animation_transfer/verify.py
          python tools/repair_character_assets.py
          python tools/sanitize_gltf.py
          set -o pipefail
          python tools/verify_models.py 2>&1 | tee /tmp/models.log || { grep FAIL /tmp/models.log | while IFS= read -r l; do echo "::error title=verify_models::$l"; done; exit 1; }
      - name: Download verified Android build tools
        run: python tools/bootstrap_android.py
      - name: Compile and sign APK
        run: python tools/build_apk.py
      - name: Upload installable Android prototype
        uses: actions/upload-artifact@v4
        with:
          name: Rogue-Blood-Moon-v0.1.18-APK
          path: dist/Rogue-Blood-Moon-v0.1.18.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish one directly installable APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk_tag="prototype-v0.1.18-${GITHUB_RUN_NUMBER}"
          release_files=(
            dist/Rogue-Blood-Moon-v0.1.18.apk
          )
          if gh release view "$apk_tag" >/dev/null 2>&1; then
            gh release upload "$apk_tag" "${release_files[@]}" --clobber
          else
            gh release create "$apk_tag" "${release_files[@]}" --target "$GITHUB_SHA" --prerelease --title "Rogue: Blood Moon v0.1.18" --notes-file docs/release-v0118.md
          fi
      - name: Upload UI preview on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: dist/
          if-no-files-found: ignore
