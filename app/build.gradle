plugins { id 'com.android.application' }

android {
    namespace 'com.roguebloodmoon.prototype'
    compileSdk 35
    defaultConfig {
        applicationId 'com.roguebloodmoon.prototype'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }
    buildTypes { debug { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
